name: Publish Docker Images

# Publishes the three runtime images the local/on-prem provisioner pulls:
#   ghcr.io/rockwarehq/rw-server-api
#   ghcr.io/rockwarehq/rw-server-workers
#   ghcr.io/rockwarehq/rw-server-livestore
# Multi-arch (amd64 + arm64). Fly deploys are unaffected — they build their
# own images via fly-deploy.yml.
#
# Each architecture is built on a NATIVE runner (ubuntu-latest for amd64,
# ubuntu-24.04-arm for arm64) and the two are merged into one manifest per
# target. We do NOT use QEMU: emulating the arm64 build crashes — Node under
# qemu-user hits an illegal instruction during `pnpm install` (SIGILL). Same
# pattern as rw-ui's docker-publish.yml.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [api, workers, livestore]
        arch:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm # native ARM runner — no QEMU
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.arch.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          echo "REGISTRY_IMAGE=ghcr.io/${{ github.repository_owner }}/rw-server-${{ matrix.target }}" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker meta (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build this arch natively and push by DIGEST only (no tag). The tags are
      # applied to the merged manifest in the `merge` job.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.arch.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.target }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        target: [api, workers, livestore]
    env:
      REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/rw-server-${{ matrix.target }}
    steps:
      - name: Set VERSION (git short sha)
        run: echo "VERSION=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.target }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ env.VERSION }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Stitch the per-arch digests into one multi-arch manifest under each tag.
      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      # Fails the run if the published tag is not a 2-arch manifest, so a
      # single-arch regression can never reach a tenant box silently.
      - name: Inspect and verify both arches present
        run: |
          docker buildx imagetools inspect "${{ env.REGISTRY_IMAGE }}:${{ env.VERSION }}"
          inspect="$(docker buildx imagetools inspect "${{ env.REGISTRY_IMAGE }}:${{ env.VERSION }}")"
          echo "$inspect" | grep -q 'linux/amd64' || { echo '::error::amd64 missing from manifest'; exit 1; }
          echo "$inspect" | grep -q 'linux/arm64' || { echo '::error::arm64 missing from manifest'; exit 1; }
