name: CI

# PRs only: a push to dev/main lands code its PR already checked, so
# re-running there just doubles the minutes. Run by hand if needed.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Quality checks: typecheck/build + lint + unit tests ─────────
  # Integration tests that need real Postgres + Redis are intentionally
  # deferred for now (no service containers / migrations wired up yet).
  quality:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          # Self-hosted runners keep pnpm's store on disk; uploading it to GitHub's cache is slow.
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # prisma.config.ts supplies a placeholder connection string, so codegen
      # runs without a live database.
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build (typecheck)
        run: pnpm build

      # The root build doesn't emit the client's declarations; this is where
      # TS7056 on the app router shows up, so catch it before a release does.
      - name: Build RPC client
        run: pnpm build
        working-directory: packages/rpc-client

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test
