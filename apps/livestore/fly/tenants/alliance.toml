app = 'rw-alliance-livestore'

# Alliance (Luke, allianceinnv.com). us-east: base.toml primary_region iad
# matches PlanetScale us-east + Upstash us-east-1.

# Fly secrets (set by rw-provisioner `tenant-provision rw-alliance`):
# JWT_SECRET is SHARED with rw-alliance-api (livestore verifies api-issued
# JWTs); NATS_TAGS_SOURCE_DOMAIN/STREAM ('edge'/'TAGS') make the cloud RW_TAGS
# stream source the edge gateway's leaf JetStream domain. The domain is public
# because the BROWSER connects to livestore directly (rw-ui bakes
# VITE_LIVESTORE_URL into the bundle).
[_meta]
required_secrets = [
  'DATABASE_URL',
  'DATABASE_URL_MIGRATION',
  'NATS_URL',
  'JWT_SECRET',
  'NATS_TAGS_SOURCE_DOMAIN',
  'NATS_TAGS_SOURCE_STREAM',
]
domain = 'alliance-livestore.rockware.io'

[env]
LOG_LEVEL = 'info'
